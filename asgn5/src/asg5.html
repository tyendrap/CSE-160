<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Assignment 5: Exploring a High-Level Graphics Library</title>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
      }
    }
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,.6);
        color: white;
        padding: 10px;
        z-index: 100;
      }
    </style>
  </head>

  <body>

  <div id="ui">

    <p>
      Cat chasing cat bowls in backyard. <br>
      Tree by Marc Solà [CC-BY] via Poly Pizza <br>
      Bowls Cat by J-Toastie [CC-BY] via Poly Pizza
    </p>
    <p>
      Light:
      <button id="lightOnButton">ON</button>
      <button id="lightOffButton">OFF</button>
    </p>

    <p>
      Light X
      <input type="range" min="-10" max="10" step="0.1" value="0" id="lightSlideX">
    </p>

    <p>
      Light Y
      <input type="range" min="0" max="20" step="0.1" value="10" id="lightSlideY">
    </p>

    <p>
      Light Z
      <input type="range" min="-10" max="10" step="0.1" value="0" id="lightSlideZ">
    </p>

  </div>

  <script type="module" src="asg5.js"></script>

  </body>
</html>
